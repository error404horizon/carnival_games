<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Carnival — Carnival Games</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{
  --bg:#09080e; --screen:#0b1010; --orange:#ff762b; --gold:#ffd166;
  --green:#7bff9a; --purple:#c46cff; --red:#ff465e; --cyan:#4de8e0;
  --muted:#9ba49b; --line:#3c5b45;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
html{background:#08070a}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;color:var(--gold);font-family:'VT323',monospace;font-size:22px;
 background:radial-gradient(ellipse at 50% 0%,#302035 0%,#111018 45%,#07070a 100%);
 display:flex;align-items:center;justify-content:center;padding:0}
button,input{font:inherit}
button{cursor:pointer}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.screen-content{flex:none;width:min(100%,1050px);padding:clamp(12px,3vh,32px) clamp(14px,3vw,36px);transform-origin:center center}
.brandbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #34443b;padding-bottom:13px;margin-bottom:24px;color:var(--green);font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.8}
.brandbar .lights{display:flex;gap:7px}.light{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px currentColor}.light:nth-child(2){background:var(--green)}.light:nth-child(3){background:var(--purple)}
h1,h2,h3,p{margin-top:0}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(20px,4vw,39px);line-height:1.55;color:var(--orange);text-shadow:3px 3px #792a26,0 0 18px #ff762b55;margin-bottom:18px}
h2{font-family:'Press Start 2P',monospace;font-size:clamp(13px,2vw,19px);line-height:1.7;color:var(--gold);margin-bottom:20px}
h3{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.8;color:var(--green)}
p{line-height:1.35;color:#e5d9b5}
.subtitle{color:var(--muted);font-size:25px}
.pixel-art{font-size:clamp(38px,7vw,72px);line-height:1.3;filter:drop-shadow(0 0 12px #ff762b55);letter-spacing:8px;margin:8px 0 22px}
.menu-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.panel{border:1px solid var(--line);background:#0b1110d9;padding:20px;box-shadow:inset 0 0 0 3px #111a17,0 0 20px #0005}
.btn{display:block;width:100%;border:1px solid var(--orange);color:var(--gold);background:#15100f;padding:13px 15px;margin:10px 0;text-align:left;
 text-transform:uppercase;letter-spacing:1px;box-shadow:inset 0 0 0 2px #2c1714;transition:transform .12s,background .12s,color .12s}
.btn:before{content:"▶ ";color:var(--orange);opacity:0}.btn:hover,.btn:focus-visible{background:#321a15;transform:translateX(3px);outline:1px solid var(--gold)}.btn:hover:before,.btn:focus-visible:before{opacity:1}
.btn.primary{background:#2b1710;border-color:var(--gold);color:#fff0b3}.btn.secondary{border-color:#5c7161;color:var(--green)}
.btn.small{display:inline-block;width:auto;min-width:130px;text-align:center}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{border:1px solid var(--line);padding:16px 10px;background:#101411;color:var(--gold);text-align:center;line-height:1.6}
.mode strong{display:block;font-family:'Press Start 2P',monospace;font-size:10px;margin:10px 0}
.mode span{font-size:18px;color:var(--muted)}
.mode.selected{border-color:var(--orange);box-shadow:0 0 15px #ff762b33;background:#21130f}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat{border:1px solid #34483b;padding:12px 8px;text-align:center;background:#0c1310}
.stat label{display:block;font-size:17px;color:var(--muted);margin-bottom:6px}
.stat strong{font-family:'Press Start 2P',monospace;font-size:clamp(11px,2vw,16px);color:var(--gold)}
.playfield{display:grid;grid-template-columns:repeat(5,minmax(42px,1fr));gap:clamp(8px,2vw,16px);max-width:620px;margin:24px auto}
.pad{aspect-ratio:1;border:3px solid #34483b;border-radius:10px;background:#111715;box-shadow:inset 0 0 0 4px #080a09,0 5px 0 #030404;transition:filter .12s,transform .12s;position:relative;overflow:hidden}
.pad:after{content:"";position:absolute;inset:18%;border:1px solid #ffffff22;border-radius:5px}
.pad[data-color="0"]{--pad:#ff465e}.pad[data-color="1"]{--pad:#ff9b38}.pad[data-color="2"]{--pad:#ffd166}.pad[data-color="3"]{--pad:#7bff9a}.pad[data-color="4"]{--pad:#4de8e0}
.pad.lit{background:var(--pad);border-color:#fff6;filter:brightness(1.45);box-shadow:0 0 26px var(--pad),inset 0 0 20px #fff8;transform:scale(1.04)}
.pad:disabled{cursor:default;opacity:.8}
.notice{min-height:36px;text-align:center;color:var(--green);font-size:27px;margin:10px 0}
.hidden{display:none!important}
.formrow{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
input{min-width:0;flex:1;background:#080b09;border:1px solid #59705d;color:var(--gold);padding:12px;outline:none}
input:focus{border-color:var(--gold)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:10px 0 20px}
th,td{padding:11px 8px;border-bottom:1px solid #26392e;text-align:left}
th{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--orange);line-height:1.8}
td{font-size:23px;color:#e9dfc3}
tr.current td{color:var(--green);background:#112016}
.help-list{padding-left:25px;line-height:1.65;color:#e5d9b5}
.help-list li{padding-left:5px;margin:5px 0}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:1px solid #2d3b32;color:#718174;font-size:18px}
.blink{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
.runner-canvas{display:block;width:100%;max-width:760px;height:auto;margin:18px auto;border:2px solid #34483b;background:#090d0c;image-rendering:pixelated}.runner-help{text-align:center;color:var(--muted);line-height:1.5}
.runner-canvas{touch-action:manipulation}.runner-touch{display:flex;justify-content:center;gap:12px;margin:6px 0 10px}.runner-touch .btn{margin:0;min-width:140px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none}
@media(max-width:680px){.screen-content{padding:12px 14px}.menu-layout{grid-template-columns:1fr;gap:14px}.menu-art{text-align:center}.menu-art .pixel-art{margin:0}.mode-grid{grid-template-columns:1fr}.mode{display:flex;align-items:center;gap:12px;text-align:left}.mode strong{margin:0}.mode span{margin-left:auto}.stats{grid-template-columns:repeat(2,1fr)}.playfield{grid-template-columns:repeat(5,minmax(35px,1fr));gap:7px}.brandbar{font-size:8px}.panel{padding:14px}}
</style>
</head>
<body>
<div class="stage"><main class="screen-content" id="app"></main></div>

<!-- Firebase (compat SDK so it works with this non-module script) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(() => {
  /* ============================================================
     FIREBASE CONFIG — paste your web app config here
     (Firebase console → Project settings → Your apps → Web app)
     ============================================================ */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBPgzpKd8uVzTw9Nf2BzNLyZDVdiZRVWhU",
    authDomain: "carnival-game-aa9d2.firebaseapp.com",
    projectId: "carnival-game-aa9d2",
    storageBucket: "carnival-game-aa9d2.firebasestorage.app",
    messagingSenderId: "1040154776732",
    appId: "1:1040154776732:web:9c99d62178d80627680959"
  };

  let db = null;
  try {
    if (window.firebase && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY') {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }
  } catch (e) { console.warn('Firebase init failed, using local scores only', e); db = null; }

  const colFor = g => 'scores_' + g;               // one collection per game
  const TOP_N = 7;                                  // entries shown on the board
  // One document per player per game: the id comes from the name (case-insensitive)
  const idFor = name => 'n_' + String(name||'guest').trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'_').slice(0,40);
  const withTimeout = (p, ms = 8000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  async function fetchTop(g) {
    const snap = await db.collection(colFor(g)).orderBy('score', 'desc').limit(TOP_N).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  const app = document.getElementById('app');
  const stage = document.querySelector('.stage');
  function fit(){
    const h=app.offsetHeight, w=app.offsetWidth;
    const k=Math.min(1, stage.clientHeight/h, stage.clientWidth/w);
    app.style.transform = k<1 ? `scale(${k})` : 'none';
  }
  if(window.ResizeObserver) new ResizeObserver(fit).observe(app);
  window.addEventListener('resize', fit);
  const COLORS = ['#ff465e','#ff9b38','#ffd166','#7bff9a','#4de8e0'];
  const ICONS = ['🩸','🎃','🌙','👻','🦇'];
  const STORE_KEY = 'hauntotron_leaderboard_v1';
  let screen = 'home', mode = 'medium', sequence = [], inputIndex = 0, gameType = 'sequence';
  let cardDeck=[], flippedCards=[], matchedCards=[], cardMoves=0, cardLimit=24, replaysLeft=3;
  let score = 0, round = 1, best = 0;
  let accepting = false, busy = false, soundOn = true, soundCtx = null;
  let playerName = localStorage.getItem('hauntotron_name') || '', lastScore = 0, lastRound = 1, lbGame = 'sequence';

  const modes = {
    easy:   {label:'BOO BEGINNER', count:3, speed:720, rounds:12, points:10},
    medium: {label:'MIDWAY MAYHEM', count:5, speed:480, rounds:20, points:15},
    hard:   {label:'NIGHTMARE', count:5, speed:420, rounds:25, points:20}
  };
  const GAME_NAMES = {sequence:'LIGHTS', cards:'CARDS', runner:'RUNNER'};
  const LEVEL_LABELS = {sequence:'ROUND', cards:'PAIRS', runner:'SECONDS'};
  // Personal best is stored per player name (not per laptop)
  const bestKey=g=>'hauntotron_best_'+g+'_'+idFor(playerName);
  function bestOf(g){return Number(localStorage.getItem(bestKey(g))||0)}
  // One-time: the old per-laptop best moves to whoever's name is active first
  function migrateLegacy(){
    if(!playerName.trim())return;
    for(const g of Object.keys(GAME_NAMES)){
      try{
        const old=localStorage.getItem('hauntotron_best_'+g);
        if(old!==null){
          if(!localStorage.getItem(bestKey(g)))localStorage.setItem(bestKey(g),old);
          localStorage.removeItem('hauntotron_best_'+g);
        }
      }catch(e){}
    }
  }
  function loadBest(){best=bestOf(gameType)}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function shell(content){
    app.innerHTML = `<div class="brandbar"><span>☠ HAUNT-O-TRON</span><span class="lights"><i class="light"></i><i class="light"></i><i class="light"></i></span><span>INSERT COURAGE</span></div>${content}<div class="footer"><span>© 1986 MIDNIGHT MIDWAY</span><span>STEP RIGHT UP <span class="blink">_</span></span></div>`;
    fit();
  }
  function playTone(freq=440,duration=.12,type='square',volume=.04){
    if(!soundOn) return;
    try{
      soundCtx = soundCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc=soundCtx.createOscillator(), gain=soundCtx.createGain();
      osc.type=type;osc.frequency.value=freq;gain.gain.value=volume;
      osc.connect(gain);gain.connect(soundCtx.destination);
      gain.gain.setTargetAtTime(0.0001,soundCtx.currentTime+duration*.65,.025);
      osc.start();osc.stop(soundCtx.currentTime+duration);
    }catch(e){}
  }
  function toneFor(i){playTone([220,277,330,440,554][i]||440,.18,'square',.035);}
  function clickSound(){playTone(180,.04,'square',.018);}
  function home(){
    screen='home';
    shell(`<section class="menu-layout">
      <div class="menu-art"><div class="pixel-art">🎪 🌕 🎃</div><h1>HALLOWEEN<br>CARNIVAL</h1><h2>CARNIVAL GAMES</h2><p class="subtitle">Step right up, if you dare...</p><p>Repeat the lights. Match the cards. Outrun the ghosts.<br>Three games, one midnight midway.</p></div>
      <div class="panel"><h3>◆ MAIN ATTRACTIONS ◆</h3>
        <button class="btn primary" data-action="play">START GAME</button>
        <button class="btn" data-action="leaderboard">HIGH SCORE BOARD</button>
        <button class="btn" data-action="how">HOW TO PLAY</button>
        <button class="btn" data-action="settings">MACHINE SETTINGS</button>
        <div style="margin-top:20px;color:var(--muted);font-size:19px">YOUR BEST · LIGHTS <strong style="color:var(--green)">${bestOf('sequence')}</strong> · CARDS <strong style="color:var(--green)">${bestOf('cards')}</strong> · RUNNER <strong style="color:var(--green)">${bestOf('runner')}</strong></div>
      </div></section>`);
  }
  function chooseMode(){
    screen='mode';
    shell(`<h2>CHOOSE YOUR ATTRACTION</h2><p>Playing as <strong style="color:var(--green)">${esc(playerName)}</strong> &nbsp;<button class="btn small secondary" style="min-width:0;padding:2px 10px;margin:0" data-action="play">CHANGE NAME</button></p>
      <div class="mode-grid">
        <button class="mode ${gameType==='sequence'?'selected':''}" data-game="sequence"><span>💡</span><strong>SEQUENCE LIGHTS</strong><span>Repeat the pattern</span></button>
        <button class="mode ${gameType==='cards'?'selected':''}" data-game="cards"><span>🃏</span><strong>CARD MATCH</strong><span>Find every pair</span></button>
        <button class="mode ${gameType==='runner'?'selected':''}" data-game="runner"><span>👻</span><strong>GHOST RUNNER</strong><span>Jump and dodge</span></button>
      </div><div class="panel" style="margin-top:20px"><p id="mode-desc">${modeDescription()}</p><button class="btn primary" data-action="begin">START SELECTED GAME</button><button class="btn secondary" data-action="home">BACK TO LOBBY</button></div>`);
  }
  function modeDescription(){
    const m=modes[mode];
    if(gameType==='cards')return `${m.label}: 10 pairs to find, but only 24 moves. Earn 30 points per match plus a bonus for every move you have left.`;
    if(gameType==='runner')return `${m.label}: jump gravestones and duck under bats. The world keeps getting faster. The longer you survive, the higher your score.`;
    return `${m.label}: ${m.count} glowing pads, ${m.rounds} possible rounds. Earn ${m.points} base points per round. The pattern grows and speeds up every round, and you only get 3 replays.`;
  }
  function nameScreen(){
    screen='name';
    shell(`<h2>WHO'S PLAYING?</h2><p>Enter your name before you step onto the midway. Your scores will be saved on the leaderboard under this name.</p>
      <div class="panel"><form id="name-form" class="formrow"><input id="player-name" maxlength="16" value="${esc(playerName)}" placeholder="YOUR NAME" autocomplete="nickname" required><button class="btn small primary" type="submit">CONTINUE</button></form></div>
      <button class="btn secondary" data-action="home">BACK TO LOBBY</button>`);
    const input=document.getElementById('player-name');if(input){input.focus();input.select();}
  }
  function beginGame(){
    if(!playerName.trim()){nameScreen();return}
    loadBest();
    score=0;round=1;sequence=[];inputIndex=0;accepting=false;busy=false;
    if(gameType==='cards'){beginCards();return}
    if(gameType==='runner'){beginRunner();return}
    replaysLeft=3;screen='game';sequence.push(randomPad(),randomPad());renderGame('WATCH CLOSELY...');setTimeout(playSequence,550);
  }
  function beginCards(){
    screen='cards';cardMoves=0;flippedCards=[];matchedCards=[];
    const pairCount=10;cardLimit=pairCount*2+4;
    const faces=['🎃','👻','🦇','🕷️','💀','🧙','🕸️','🧛','🪦','🌙'];
    cardDeck=faces.slice(0,pairCount).flatMap((face,i)=>[{id:i*2,face},{id:i*2+1,face}]).sort(()=>Math.random()-.5);
    renderCards('FLIP TWO CARDS TO FIND A PAIR');
  }
  function renderCards(message){
    screen='cards';
    shell(`<h2>🃏 CARD MATCH</h2><div class="stats"><div class="stat"><label>MATCHES</label><strong>${matchedCards.length/2}/${cardDeck.length/2}</strong></div><div class="stat"><label>MOVES</label><strong>${cardMoves}/${cardLimit}</strong></div><div class="stat"><label>SCORE</label><strong>${score}</strong></div><div class="stat"><label>MODE</label><strong>${mode.toUpperCase()}</strong></div></div><div class="notice" id="card-notice">${message}</div><div class="playfield" style="grid-template-columns:repeat(${cardDeck.length%5===0?5:4},minmax(40px,1fr));max-width:${cardDeck.length%5===0?620:500}px">${cardDeck.map((c,i)=>`<button class="pad ${matchedCards.includes(i)?'lit':''}" style="color:var(--gold);font-size:clamp(22px,4vw,40px);${matchedCards.includes(i)||flippedCards.includes(i)?'background:#211d25;border-color:var(--orange)':''}" data-card="${i}" ${matchedCards.includes(i)||flippedCards.includes(i)||flippedCards.length>=2?'disabled':''}>${matchedCards.includes(i)||flippedCards.includes(i)?c.face:'?'}</button>`).join('')}</div><p style="text-align:center;color:var(--muted)">Find every pair before you run out of moves.</p><button class="btn secondary" data-action="again">RESTART GAME</button><button class="btn" data-action="quit">QUIT RUN</button>`);
  }
  function flipCard(i){
    if(screen!=='cards'||flippedCards.length>=2||flippedCards.includes(i)||matchedCards.includes(i))return;
    flippedCards.push(i);playTone(300+i*25,.08);renderCards('FIND THE MATCH...');
    if(flippedCards.length===2){
      cardMoves++;const [a,b]=flippedCards;
      const outOfMoves=()=>{lastScore=score;lastRound=matchedCards.length/2;setTimeout(()=>{if(screen==='cards')finishRun(false,'GAME OVER','OUT OF MOVES')},700)};
      if(cardDeck[a].face===cardDeck[b].face){
        matchedCards.push(a,b);score+=30;flippedCards=[];playTone(660,.1);renderCards('A MATCH! THE SPIRITS SMILE.');
        if(matchedCards.length===cardDeck.length){score+=Math.max(0,(cardLimit-cardMoves)*10);lastScore=score;lastRound=cardDeck.length/2;updateBest();setTimeout(victory,500)}
        else if(cardMoves>=cardLimit)outOfMoves();
      }else{
        if(cardMoves>=cardLimit)outOfMoves();
        setTimeout(()=>{if(screen!=='cards')return;flippedCards=[];renderCards(cardMoves>=cardLimit?'OUT OF MOVES!':'NO MATCH — TRY AGAIN!')},650);
      }
    }
  }
  let runnerRAF=0, runnerState=null;
  function beginRunner(){
    screen='runner'; score=0; round=1; lastScore=0; lastRound=1;
    runnerState={x:72,y:158,vy:0,ground:158,duck:false,obstacles:[],spawn:0,speed:4,alive:true,frames:0,py:158,ph:34};
    renderRunner();
  }
  function runnerJump(){
    const g=runnerState;
    if(screen==='runner'&&g&&g.alive&&g.y>=g.ground-1){g.vy=-11.5;playTone(520,.08,'square',.025);}
  }
  function renderRunner(){
    cancelAnimationFrame(runnerRAF);
    screen='runner';
    shell(`<h2>👻 GHOST RUNNER</h2><div class="stats"><div class="stat"><label>SCORE</label><strong id="runner-score">0</strong></div><div class="stat"><label>BEST</label><strong id="runner-best">${best}</strong></div><div class="stat"><label>SPEED</label><strong id="runner-speed">1x</strong></div><div class="stat"><label>MODE</label><strong>${mode.toUpperCase()}</strong></div></div><canvas id="runner-canvas" class="runner-canvas" width="760" height="250" aria-label="Ghost Runner game"></canvas><div class="runner-touch"><button class="btn small" data-run="jump">▲ JUMP</button><button class="btn small" data-run="duck">▼ DUCK</button></div><p class="runner-help">SPACE / ↑ = JUMP &nbsp; · &nbsp; ↓ = DUCK &nbsp; · &nbsp; TAP THE SCREEN TO JUMP<br>Jump over gravestones, duck under flying bats. The faster you go, the faster it gets!</p><button class="btn secondary" data-action="runner-restart">RESTART RUN</button><button class="btn" data-action="quit">QUIT RUN</button>`);
    const c=document.getElementById('runner-canvas'),ctx=c.getContext('2d'),g=runnerState;
    const STEP=1000/60;let last=0,acc=0;
    const step=()=>{
      g.frames++;g.speed=5+Math.min(10,g.frames/330);g.spawn--;
      if(g.spawn<=0){
        if(Math.random()<.35){g.obstacles.push({x:780,y:140,w:34,h:24,type:'bat'});}
        else{
          g.obstacles.push({x:780,y:180,w:25,h:30,type:'grave'});
          if(g.frames>600&&Math.random()<Math.min(.4,g.frames/3000))g.obstacles.push({x:814,y:180,w:25,h:30,type:'grave'});
        }
        g.spawn=Math.max(36,80-Math.floor(g.frames/60))+Math.random()*28;
      }
      g.y+=g.vy;g.vy+=.65;if(g.y>g.ground){g.y=g.ground;g.vy=0;}
      g.obstacles.forEach(o=>o.x-=g.speed);g.obstacles=g.obstacles.filter(o=>o.x+o.w>0);
      const duck=g.duck&&g.y>=g.ground-1;g.py=duck?g.y+10:g.y;g.ph=duck?24:34;
      for(const o of g.obstacles){
        if(g.x+28>o.x+4&&g.x<o.x+o.w-4&&g.py+g.ph>o.y+3&&g.py<o.y+o.h-2){
          g.alive=false;lastRound=Math.floor(g.frames/60)+1;playTone(100,.5,'sawtooth',.05);
          finishRun(false,'GAME OVER','THE GHOST GOT CAUGHT');return false;
        }
      }
      score=Math.floor(g.frames/3);lastScore=score;updateBest();
      return true;
    };
    const paint=()=>{
      const px=g.x,py=g.py;
      ctx.clearRect(0,0,760,250);ctx.fillStyle='#090d0c';ctx.fillRect(0,0,760,250);
      ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(665,45,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#090d0c';ctx.beginPath();ctx.arc(674,38,18,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#7bff9a';for(let i=0;i<22;i++){let x=(i*47-(g.frames*g.speed*.25)%760+760)%760;ctx.fillRect(x,20+(i*31)%95,2,2)}
      ctx.fillStyle='#283c31';ctx.fillRect(0,210,760,40);ctx.strokeStyle='#7bff9a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,210);ctx.lineTo(760,210);ctx.stroke();
      ctx.fillStyle='#18231d';for(let i=0;i<8;i++){let x=(i*115-(g.frames*g.speed*.45)%920+920)%920;ctx.fillRect(x,177,35,33);ctx.beginPath();ctx.arc(x+17.5,177,17.5,Math.PI,0);ctx.fill();}
      for(const o of g.obstacles){if(o.type==='grave'){ctx.fillStyle='#9ba49b';ctx.fillRect(o.x+5,o.y+9,18,21);ctx.fillRect(o.x,o.y+15,28,6);ctx.fillStyle='#ff762b';ctx.fillRect(o.x+12,o.y+15,3,10)}else{ctx.fillStyle='#c46cff';ctx.font='28px serif';ctx.fillText('🦇',o.x-3,o.y+24)}}
      ctx.fillStyle='#e5d9b5';ctx.fillRect(px+5,py+4,23,21);ctx.fillRect(px,py+11,33,13);ctx.fillRect(px+2,py+23,7,8);ctx.fillRect(px+13,py+23,7,8);ctx.fillRect(px+24,py+23,7,8);ctx.fillStyle='#090d0c';ctx.fillRect(px+10,py+10,4,6);ctx.fillRect(px+21,py+10,4,6);
    };
    const loop=ts=>{
      if(screen!=='runner'||runnerState!==g||!g.alive)return;
      if(!last)last=ts;
      acc+=Math.min(100,ts-last);last=ts;
      while(acc>=STEP){acc-=STEP;if(!step())return;}
      paint();
      const a=document.getElementById('runner-score'),b=document.getElementById('runner-best'),s=document.getElementById('runner-speed');
      if(a)a.textContent=score;if(b)b.textContent=best;if(s)s.textContent=(g.speed/5).toFixed(1)+'x';
      runnerRAF=requestAnimationFrame(loop);
    };
    runnerRAF=requestAnimationFrame(loop);
  }
  function runnerKey(e){
    if(screen!=='runner'||!runnerState||!runnerState.alive)return;
    if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
    if(e.code==='Space'||e.key==='ArrowUp')runnerJump();
    if(e.key==='ArrowDown')runnerState.duck=true;
  }
  document.addEventListener('keydown',runnerKey);
  document.addEventListener('keyup',e=>{
    if(screen==='runner'&&[' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
    if(runnerState&&e.key==='ArrowDown')runnerState.duck=false;
  });
  function updateBest(){if(score>best){best=score;try{localStorage.setItem(bestKey(gameType),String(best))}catch(e){}}}
  function randomPad(){return Math.floor(Math.random()*modes[mode].count);}
  function renderGame(message=''){
    screen='game';
    const m=modes[mode];
    shell(`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">ROUND ${round}</h2><span style="color:var(--orange)">MODE: ${m.label}</span></div>
      <div class="stats"><div class="stat"><label>SCORE</label><strong>${score}</strong></div><div class="stat"><label>BEST</label><strong>${Math.max(best,score)}</strong></div><div class="stat"><label>SEQUENCE</label><strong>${sequence.length}</strong></div><div class="stat"><label>MAX ROUNDS</label><strong>${m.rounds}</strong></div></div>
      <div class="notice" id="notice">${message}</div>
      <div class="playfield">${Array.from({length:5},(_,i)=>`<button class="pad ${i>=m.count?'hidden':''}" data-pad="${i}" data-color="${i}" aria-label="Light ${i+1}" ${accepting?'':'disabled'}></button>`).join('')}</div>
      <div style="text-align:center;color:var(--muted)">WATCH THE LIGHTS. THEN REPEAT THE ORDER.</div>
      <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn small secondary" data-action="replay" ${busy||replaysLeft<=0?'disabled':''}>REPLAY (${replaysLeft})</button><button class="btn small" data-action="quit">QUIT RUN</button></div>`);
  }
  function flashPad(index,duration=240){
    return new Promise(resolve=>{
      const pad=app.querySelector(`[data-pad="${index}"]`);
      if(!pad){resolve();return}
      pad.classList.add('lit');toneFor(index);
      setTimeout(()=>{pad.classList.remove('lit');setTimeout(resolve,100)},duration);
    });
  }
  async function playSequence(){
    if(screen!=='game')return;
    busy=true;accepting=false;
    const notice=document.getElementById('notice');if(notice)notice.textContent='WATCH CLOSELY...';
    app.querySelectorAll('.pad').forEach(p=>p.disabled=true);
    await new Promise(r=>setTimeout(r,300));
    const sp=Math.max(230,modes[mode].speed-round*16);
    for(let i=0;i<sequence.length;i++){
      if(screen!=='game')return;
      await flashPad(sequence[i],Math.max(120,sp-170));
      await new Promise(r=>setTimeout(r,Math.max(60,sp-330)));
    }
    if(screen!=='game')return;
    busy=false;accepting=true;inputIndex=0;
    app.querySelectorAll('.pad:not(.hidden)').forEach(p=>p.disabled=false);
    const n=document.getElementById('notice');if(n)n.textContent='YOUR TURN — REPEAT IT!';
    const rb=app.querySelector('[data-action="replay"]');if(rb)rb.disabled=replaysLeft<=0;
  }
  async function handlePad(i){
    if(!accepting||busy||screen!=='game')return;
    flashPad(i,130);
    if(i!==sequence[inputIndex]){
      accepting=false;busy=true;playTone(100,.5,'sawtooth',.05);
      setTimeout(gameOver,550);return;
    }
    inputIndex++;
    if(inputIndex===sequence.length){
      accepting=false;busy=true;
      score += modes[mode].points * round;
      updateBest();
      const n=document.getElementById('notice');if(n)n.textContent='PERFECT! THE SPIRITS APPROVE!';
      playTone(660,.12);setTimeout(()=>playTone(880,.16),100);
      if(round>=modes[mode].rounds){setTimeout(victory,850);return}
      round++;sequence.push(randomPad());
      setTimeout(()=>{if(screen==='game'){renderGame('ROUND '+round+' — GET READY...');setTimeout(playSequence,450)}},850);
    }
  }
  function gameOver(){
    if(screen!=='game')return;
    lastScore=score;lastRound=round;
    finishRun(false,'GAME OVER','THE CARNIVAL CLAIMS ANOTHER');
  }
  function victory(){
    lastScore=score;if(gameType==='sequence')lastRound=round;
    if(gameType==='cards')finishRun(true,'YOU WIN!','ALL PAIRS FOUND');
    else finishRun(true,'YOU SURVIVED!','MASTER OF THE MIDWAY');
  }
  function finishRun(won,heading,sub){
    screen=won?'victory':'over';lastScore=score;updateBest();
    const endScreen=screen, who=playerName, gName=GAME_NAMES[gameType];
    shell(`<div style="text-align:center"><div class="pixel-art">${won?'🏆 🎃 🦇':'👻 💀 🎃'}</div><h1${won?'':' style="color:var(--red)"'}>${heading}</h1><h2>${sub}</h2>
      <div class="stats"><div class="stat"><label>FINAL SCORE</label><strong>${score}</strong></div><div class="stat"><label>${LEVEL_LABELS[gameType]}</label><strong>${lastRound}</strong></div><div class="stat"><label>BEST</label><strong>${best}</strong></div><div class="stat"><label>GAME</label><strong>${gName}</strong></div></div>
      <p id="save-msg" style="color:var(--green)">SAVING YOUR SCORE...</p>
      <button class="btn primary" data-action="again">${won?'PLAY AGAIN':'TRY AGAIN'}</button><button class="btn secondary" data-action="leaderboard">VIEW LEADERBOARD</button><button class="btn secondary" data-action="choose">CHANGE GAME</button><button class="btn secondary" data-action="home">MAIN LOBBY</button></div>`);
    saveScore().then(({rank,online,improved})=>{
      if(screen!==endScreen)return;
      const el=document.getElementById('save-msg');if(!el)return;
      const where=online?'GLOBAL':'LOCAL';
      el.textContent = rank===-1 ? `NO POINTS THIS TIME, ${who} — TRY AGAIN!`
        : !improved ? `NOT A NEW BEST FOR ${who} — YOUR BOARD SCORE STAYS${rank>0?' (RANK #'+rank+')':''}`
        : rank>0 ? `NEW BEST SAVED FOR ${who} — RANK #${rank} ON THE ${where} ${gName} BOARD`
        : `GOOD RUN, ${who} — BUT NOT IN THE TOP ${TOP_N} THIS TIME`;
      if(!online && rank!==-1) el.textContent += ' (OFFLINE — SAVED ON THIS DEVICE ONLY)';
    });
  }

  /* ---------- Score storage: Firestore first, localStorage fallback ---------- */
  function readScores(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]').filter(r=>r&&r.game!=='numbers')}catch(e){return []}}
  function saveLocal(entry){
    entry={...entry,id:idFor(entry.name)};
    let list=readScores(), improved=true;
    const same=list.find(r=>(r.game||'sequence')===entry.game&&idFor(r.name)===entry.id);
    if(same){ if(entry.score>same.score){list=list.filter(r=>r!==same);list.push(entry)} else improved=false; }
    else list.push(entry);
    list.sort((a,b)=>b.score-a.score||b.round-a.round);
    const counts={};list=list.filter(r=>{const k=r.game||'sequence';counts[k]=(counts[k]||0)+1;return counts[k]<=TOP_N});
    try{localStorage.setItem(STORE_KEY,JSON.stringify(list))}catch(e){}
    const rank=list.filter(r=>(r.game||'sequence')===entry.game).findIndex(r=>idFor(r.name)===entry.id)+1;
    return {rank,improved};
  }
  // Writes only if this score beats the player's existing one. Returns true if saved.
  async function submitOnline(entry){
    const ref=db.collection(colFor(entry.game)).doc(idFor(entry.name));
    return db.runTransaction(async t=>{
      const s=await t.get(ref);
      if(s.exists&&s.data().score>=entry.score)return false;
      t.set(ref,entry);
      return true;
    });
  }
  async function saveScore(){
    if(lastScore<=0)return {rank:-1,online:false,improved:false};
    const entry={name:(playerName||'MYSTERY GUEST').trim().slice(0,16),score:Math.floor(lastScore),mode:mode,game:gameType,round:Math.floor(lastRound),date:new Date().toISOString()};
    if(db){
      try{
        const improved=await withTimeout(submitOnline(entry));
        const top=await withTimeout(fetchTop(entry.game));
        return {rank:top.findIndex(r=>r.id===idFor(entry.name))+1,online:true,improved};
      }catch(e){console.warn('Firestore save failed, saving locally',e)}
    }
    const r=saveLocal(entry);
    return {rank:r.rank,online:false,improved:r.improved};
  }
  // Keeps this browser's personal bests and the online board in agreement for the current name
  async function syncBests(){
    if(!db||!playerName.trim())return;
    const id=idFor(playerName);
    for(const g of Object.keys(GAME_NAMES)){
      try{
        const snap=await withTimeout(db.collection(colFor(g)).doc(id).get());
        const remote=snap.exists?snap.data().score:0, local=bestOf(g);
        if(remote>local){try{localStorage.setItem(bestKey(g),String(remote))}catch(e){}}
        else if(local>remote){
          await withTimeout(submitOnline({name:playerName.trim().slice(0,16),score:local,mode:mode,game:g,round:g==='runner'?Math.max(1,Math.round(local/20)):1,date:new Date().toISOString()}));
        }
      }catch(e){}
    }
  }
  function drawLeaderboard(list,state){
    // state: 'loading' | 'online' | 'offline'
    const rows=state==='loading'
      ?`<tr><td colspan="4" style="text-align:center;color:var(--muted)">SUMMONING SCORES...</td></tr>`
      :list.length?list.map((r,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${esc(r.name)}</td><td>${r.score}</td><td>${r.round}</td></tr>`).join(''):`<tr><td colspan="4" style="text-align:center;color:var(--muted)">NO SOULS ON THE BOARD YET. BE THE FIRST!</td></tr>`;
    const tabs=Object.keys(GAME_NAMES).map(k=>`<button class="btn small ${k===lbGame?'primary':'secondary'}" style="margin:0" data-lb="${k}">${GAME_NAMES[k]}</button>`).join('');
    const note=state==='offline'?'Could not reach the online board. Showing scores saved on this device only.':'';
    shell(`<h2>🏆 HIGH SCORE BOARD</h2><p>Legends of the Midnight Midway.</p><div class="formrow">${tabs}</div><div class="table-wrap"><table><thead><tr><th>RANK</th><th>PLAYER</th><th>SCORE</th><th>${LEVEL_LABELS[lbGame]}</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${note?`<p style="color:var(--muted);font-size:19px">${note}</p>`:''}<button class="btn primary" data-action="play">PLAY FOR A PLACE</button><button class="btn secondary" data-action="refresh-scores">REFRESH BOARD</button><button class="btn secondary" data-action="home">BACK TO LOBBY</button>`);
  }
  async function leaderboard(g){
    screen='leaderboard';lbGame=g||gameType;const game=lbGame;
    drawLeaderboard([],'loading');
    let list=null;
    if(db){try{list=await withTimeout(fetchTop(game))}catch(e){console.warn('Firestore read failed',e)}}
    if(screen!=='leaderboard'||lbGame!==game)return;
    if(list)drawLeaderboard(list,'online');
    else drawLeaderboard(readScores().filter(r=>(r.game||'sequence')===game),'offline');
  }
  function howTo(){
    screen='how';
    shell(`<h2>HOW TO PLAY</h2><div class="panel"><ol class="help-list"><li>Enter your name first. Every finished run is saved to the leaderboard for you.</li><li>Sequence Lights: watch the lights and repeat their order.</li><li>Card Match: flip two cards and find every matching pair.</li><li>Ghost Runner: jump gravestones (Space / ↑) and duck under bats (↓). On touch screens, use the on-screen buttons or tap to jump.</li><li>In Sequence Lights, a wrong move ends the run. Spooky, but fair.</li><li>Everything plays at Medium difficulty. Try to beat your best score.</li></ol><p style="color:var(--green)">TIP: Say the colors quietly in your head as they flash.</p></div><button class="btn primary" data-action="play">I'M READY</button><button class="btn secondary" data-action="home">BACK TO LOBBY</button>`);
  }
  function settings(){
    screen='settings';
    shell(`<h2>MACHINE SETTINGS</h2><div class="panel"><div class="formrow" style="align-items:center"><span style="min-width:150px">SOUND EFFECTS</span><button class="btn small ${soundOn?'primary':'secondary'}" data-action="sound">${soundOn?'ON':'OFF'}</button></div><p style="color:var(--muted);font-size:19px">Your personal best is stored in this browser. The high score board is shared online.</p></div><button class="btn secondary" data-action="home">SAVE & BACK</button>`);
  }
  app.addEventListener('click',e=>{
    const lb=e.target.closest('[data-lb]');
    if(lb){clickSound();leaderboard(lb.dataset.lb);return}
    const card=e.target.closest('[data-card]');
    if(card){flipCard(Number(card.dataset.card));return}
    const pad=e.target.closest('[data-pad]');
    if(pad){handlePad(Number(pad.dataset.pad));return}
    const gameButton=e.target.closest('[data-game]');
    if(gameButton){gameType=gameButton.dataset.game;loadBest();chooseMode();clickSound();return}
    const modeButton=e.target.closest('[data-mode]');
    if(modeButton){mode=modeButton.dataset.mode;if(screen==='mode')chooseMode();else settings();clickSound();return}
    const button=e.target.closest('[data-action]');if(!button)return;
    clickSound();
    switch(button.dataset.action){
      case 'play':nameScreen();break;
      case 'choose':chooseMode();break;
      case 'begin':beginGame();break;
      case 'runner-restart':beginRunner();break;
      case 'home':home();break;
      case 'leaderboard':leaderboard();break;
      case 'how':howTo();break;
      case 'settings':settings();break;
      case 'again':beginGame();break;
      case 'quit':if(confirm('Leave this run? Your current score will not be saved.'))home();break;
      case 'replay':if(!busy&&screen==='game'&&replaysLeft>0){replaysLeft--;accepting=false;busy=true;renderGame('WATCH CLOSELY...');playSequence();}break;
      case 'sound':soundOn=!soundOn;settings();break;
      case 'refresh-scores':leaderboard(lbGame);break;
    }
  });
  app.addEventListener('pointerdown',e=>{
    const b=e.target.closest('[data-run]');
    if(b){e.preventDefault();if(b.dataset.run==='jump')runnerJump();else if(runnerState&&screen==='runner')runnerState.duck=true;return}
    if(e.target.id==='runner-canvas'){e.preventDefault();runnerJump();}
  });
  const stopDuck=()=>{if(runnerState)runnerState.duck=false};
  document.addEventListener('pointerup',stopDuck);document.addEventListener('pointercancel',stopDuck);
  app.addEventListener('submit',e=>{
    if(e.target.id!=='name-form')return;
    e.preventDefault();
    const input=document.getElementById('player-name');
    const v=(input?.value||'').trim();
    if(!v){if(input){input.value='';input.focus();}return}
    playerName=v.slice(0,16);
    try{localStorage.setItem('hauntotron_name',playerName)}catch(err){}
    migrateLegacy();
    clickSound();chooseMode();
    syncBests().then(()=>{loadBest()});
  });
  document.addEventListener('keydown',e=>{
    if(screen!=='game'||!accepting||busy)return;
    const key=Number(e.key);
    if(key>=1&&key<=modes[mode].count)handlePad(key-1);
  });
  migrateLegacy();
  home();
})();
</script>
</body>
</html>
