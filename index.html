<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Carnival — Carnival Games</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{
  --bg:#09080e; --screen:#0b1010; --orange:#ff762b; --gold:#ffd166;
  --green:#7bff9a; --purple:#c46cff; --red:#ff465e; --cyan:#4de8e0;
  --muted:#9ba49b; --line:#3c5b45;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
html{background:#08070a}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;color:var(--gold);font-family:'VT323',monospace;font-size:22px;
 background:radial-gradient(ellipse at 50% 0%,#302035 0%,#111018 45%,#07070a 100%);
 display:flex;align-items:center;justify-content:center;padding:0}
button,input{font:inherit}
button{cursor:pointer}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.screen-content{flex:none;width:min(100%,1050px);padding:clamp(12px,3vh,32px) clamp(14px,3vw,36px);transform-origin:center center}
.brandbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #34443b;padding-bottom:13px;margin-bottom:24px;color:var(--green);font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.8}
.brandbar .lights{display:flex;gap:7px}.light{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px currentColor}.light:nth-child(2){background:var(--green)}.light:nth-child(3){background:var(--purple)}
h1,h2,h3,p{margin-top:0}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(20px,4vw,39px);line-height:1.55;color:var(--orange);text-shadow:3px 3px #792a26,0 0 18px #ff762b55;margin-bottom:18px}
h2{font-family:'Press Start 2P',monospace;font-size:clamp(13px,2vw,19px);line-height:1.7;color:var(--gold);margin-bottom:20px}
h3{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.8;color:var(--green)}
p{line-height:1.35;color:#e5d9b5}
.subtitle{color:var(--muted);font-size:25px}
.pixel-art{font-size:clamp(38px,7vw,72px);line-height:1.3;filter:drop-shadow(0 0 12px #ff762b55);letter-spacing:8px;margin:8px 0 22px}
.menu-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.panel{border:1px solid var(--line);background:#0b1110d9;padding:20px;box-shadow:inset 0 0 0 3px #111a17,0 0 20px #0005}
.btn{display:block;width:100%;border:1px solid var(--orange);color:var(--gold);background:#15100f;padding:13px 15px;margin:10px 0;text-align:left;
 text-transform:uppercase;letter-spacing:1px;box-shadow:inset 0 0 0 2px #2c1714;transition:transform .12s,background .12s,color .12s}
.btn:before{content:"▶ ";color:var(--orange);opacity:0}.btn:hover,.btn:focus-visible{background:#321a15;transform:translateX(3px);outline:1px solid var(--gold)}.btn:hover:before,.btn:focus-visible:before{opacity:1}
.btn.primary{background:#2b1710;border-color:var(--gold);color:#fff0b3}.btn.secondary{border-color:#5c7161;color:var(--green)}
.btn.small{display:inline-block;width:auto;min-width:130px;text-align:center}
.btn.danger{border-color:#7a2a31;color:#ff9aa5;background:#1a0f11}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.booth-tag{display:inline-flex;align-items:center;gap:8px;margin:2px 0 10px;border:1px solid var(--line);padding:6px 10px;color:var(--green);font-size:18px;background:#0b1110d9}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px currentColor;flex:none}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.panel-head h3{margin:0}
.queue-meta{font-size:17px;color:var(--muted);margin:0 0 4px;min-height:1.3em}
.queue-flash{font-size:17px;color:var(--green);margin:2px 0 6px;min-height:1.3em}
.queue-row{display:flex;align-items:center;gap:10px;border:1px solid #26392e;background:#080d0b;padding:9px 10px}
.queue-row.head{border-color:var(--gold);background:#21130f;box-shadow:0 0 12px #ff762b22}
.q-pos{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--orange);min-width:22px;text-align:center;flex:none}
.q-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-name small{display:block;font-size:16px;color:var(--muted);margin-top:2px}
.q-badge{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);white-space:nowrap;flex:none}
.queue-empty{text-align:center;color:var(--muted);padding:18px;border:1px dashed #2d3b32;line-height:1.5}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{border:1px solid var(--line);padding:16px 10px;background:#101411;color:var(--gold);text-align:center;line-height:1.6}
.mode strong{display:block;font-family:'Press Start 2P',monospace;font-size:10px;margin:10px 0}
.mode span{font-size:18px;color:var(--muted)}
.mode.selected{border-color:var(--orange);box-shadow:0 0 15px #ff762b33;background:#21130f}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat{border:1px solid #34483b;padding:12px 8px;text-align:center;background:#0c1310}
.stat label{display:block;font-size:17px;color:var(--muted);margin-bottom:6px}
.stat strong{font-family:'Press Start 2P',monospace;font-size:clamp(11px,2vw,16px);color:var(--gold)}
.playfield{display:grid;grid-template-columns:repeat(5,minmax(42px,1fr));gap:clamp(8px,2vw,16px);max-width:620px;margin:24px auto}
.pad{aspect-ratio:1;border:3px solid #34483b;border-radius:10px;background:#111715;box-shadow:inset 0 0 0 4px #080a09,0 5px 0 #030404;transition:filter .12s,transform .12s;position:relative;overflow:hidden}
.pad:after{content:"";position:absolute;inset:18%;border:1px solid #ffffff22;border-radius:5px}
.pad[data-color="0"]{--pad:#ff465e}.pad[data-color="1"]{--pad:#ff9b38}.pad[data-color="2"]{--pad:#ffd166}.pad[data-color="3"]{--pad:#7bff9a}.pad[data-color="4"]{--pad:#4de8e0}
.pad.lit{background:var(--pad);border-color:#fff6;filter:brightness(1.45);box-shadow:0 0 26px var(--pad),inset 0 0 20px #fff8;transform:scale(1.04)}
.pad:disabled{cursor:default;opacity:.8}
.notice{min-height:36px;text-align:center;color:var(--green);font-size:27px;margin:10px 0}
.hidden{display:none!important}
.formrow{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
input{min-width:0;flex:1;background:#080b09;border:1px solid #59705d;color:var(--gold);padding:12px;outline:none}
input:focus{border-color:var(--gold)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:10px 0 20px}
th,td{padding:11px 8px;border-bottom:1px solid #26392e;text-align:left}
th{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--orange);line-height:1.8}
td{font-size:23px;color:#e9dfc3}
tr.current td{color:var(--green);background:#112016}
.help-list{padding-left:25px;line-height:1.65;color:#e5d9b5}
.help-list li{padding-left:5px;margin:5px 0}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:1px solid #2d3b32;color:#718174;font-size:18px}
.blink{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
.runner-canvas{display:block;width:100%;max-width:760px;height:auto;margin:18px auto;border:2px solid #34483b;background:#090d0c;image-rendering:pixelated}.runner-help{text-align:center;color:var(--muted);line-height:1.5}
.runner-canvas{touch-action:manipulation}.runner-touch{display:flex;justify-content:center;gap:12px;margin:6px 0 10px}.runner-touch .btn{margin:0;min-width:140px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none}
@media(max-width:680px){.screen-content{padding:12px 14px}.menu-layout{grid-template-columns:1fr;gap:14px}.menu-art{text-align:center}.menu-art .pixel-art{margin:0}.mode-grid{grid-template-columns:1fr}.mode{display:flex;align-items:center;gap:12px;text-align:left}.mode strong{margin:0}.mode span{margin-left:auto}.stats{grid-template-columns:repeat(2,1fr)}.playfield{grid-template-columns:repeat(5,minmax(35px,1fr));gap:7px}.brandbar{font-size:8px}.panel{padding:14px}}
</style>
</head>
<body>
<div class="stage"><main class="screen-content" id="app"></main></div>
<script>
(() => {
  const app = document.getElementById('app');
  const stage = document.querySelector('.stage');
  function fit(){
    const h=app.offsetHeight, w=app.offsetWidth;
    const k=Math.min(1, stage.clientHeight/h, stage.clientWidth/w);
    app.style.transform = k<1 ? `scale(${k})` : 'none';
  }
  if(window.ResizeObserver) new ResizeObserver(fit).observe(app);
  window.addEventListener('resize', fit);
  const COLORS = ['#ff465e','#ff9b38','#ffd166','#7bff9a','#4de8e0'];
  const ICONS = ['🩸','🎃','🌙','👻','🦇'];
  const STORE_KEY = 'hauntotron_leaderboard_v1';

  /*
   * Booth wiring.
   *
   * The arcade talks to the same device API as the ESP32 booths:
   *   GET  <api> -> { ok, item: { ticket_key, name } | null, pending }
   *   POST <api> { ticket_key, cancel: true }              remove a player
   *   POST <api> { ticket_key, result: { game, score, round } }  finish + score
   *
   * The key is the booth's device key from magic.booths.api_key. For the
   * Carnival Games booth the slug is `carnival-games` and the key is GAME88.
   * Override either value with ?key=...&api=... (handy on a local Supabase) or
   * from Machine Settings on the device itself.
   */
  const params = new URLSearchParams(location.search);
  const BOOTH = {
    slug: 'carnival-games',
    key: (params.get('key') || localStorage.getItem('hauntotron_booth_key') || 'GAME88').trim(),
    api: (params.get('api') || localStorage.getItem('hauntotron_booth_api') ||
      'https://gzfpfnrukmsvlfqmdmgn.supabase.co/functions/v1/booth-queue').replace(/\/+$/, '')
  };
  for (const field of ['key', 'api']) {
    const override = params.get(field);
    if (!override) continue;
    try { localStorage.setItem('hauntotron_booth_' + field, BOOTH[field]); } catch (e) {}
  }

  let screen = 'home', mode = 'medium', sequence = [], inputIndex = 0, gameType = 'sequence';
  let cardDeck=[], flippedCards=[], matchedCards=[], cardMoves=0, cardLimit=24, replaysLeft=3;
  let score = 0, round = 1, best = 0;
  let accepting = false, busy = false, soundOn = true, soundCtx = null;
  let playerName = localStorage.getItem('hauntotron_name') || '', lastScore = 0, lastRound = 1, lbGame = 'sequence';
  let boothHead = null, boothPending = 0, queueFlash = '';
  let activePlayer = null, finishing = false;

  const modes = {
    easy:   {label:'BOO BEGINNER', count:3, speed:720, rounds:12, points:10},
    medium: {label:'MIDWAY MAYHEM', count:5, speed:480, rounds:20, points:15},
    hard:   {label:'NIGHTMARE', count:5, speed:420, rounds:25, points:20}
  };
  const GAME_NAMES = {sequence:'LIGHTS', cards:'CARDS', runner:'RUNNER'};
  const LEVEL_LABELS = {sequence:'ROUND', cards:'PAIRS', runner:'SECONDS'};
  function bestOf(g){return Number(localStorage.getItem('hauntotron_best_'+g)||0)}
  function loadBest(){best=bestOf(gameType)}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function shell(content){
    app.innerHTML = `<div class="brandbar"><span>☠ HAUNT-O-TRON</span><span class="lights"><i class="light"></i><i class="light"></i><i class="light"></i></span><span>INSERT COURAGE</span></div>${content}<div class="footer"><span>© 1986 MIDNIGHT MIDWAY</span><span>STEP RIGHT UP <span class="blink">_</span></span></div>`;
    fit();
  }
  function playTone(freq=440,duration=.12,type='square',volume=.04){
    if(!soundOn) return;
    try{
      soundCtx = soundCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc=soundCtx.createOscillator(), gain=soundCtx.createGain();
      osc.type=type;osc.frequency.value=freq;gain.gain.value=volume;
      osc.connect(gain);gain.connect(soundCtx.destination);
      gain.gain.setTargetAtTime(0.0001,soundCtx.currentTime+duration*.65,.025);
      osc.start();osc.stop(soundCtx.currentTime+duration);
    }catch(e){}
  }
  function toneFor(i){playTone([220,277,330,440,554][i]||440,.18,'square',.035);}
  function clickSound(){playTone(180,.04,'square',.018);}
  function boothReady(){return Boolean(BOOTH.key&&BOOTH.api)}
  function boothError(data,status){
    const code=data&&data.error?String(data.error):'http_'+status;
    if(code==='unauthorized')return 'booth key rejected';
    if(code==='queue_empty')return 'the queue is empty';
    if(code==='not_your_turn')return 'that player is no longer at the front';
    if(code==='result_required')return 'the score was not sent';
    return code.replace(/_/g,' ');
  }
  function home(){
    screen='home';
    shell(`<section class="menu-layout">
      <div class="menu-art"><div class="pixel-art">🎪 🌕 🎃</div><h1>HALLOWEEN<br>CARNIVAL</h1><h2>CARNIVAL GAMES</h2><p class="subtitle">Step right up, if you dare...</p><p>Repeat the lights. Match the cards. Outrun the ghosts.<br>Three games, one midnight midway.</p>
        <div class="booth-tag"><i class="dot ${boothReady()?'':'off'}"></i> BOOTH ${esc(BOOTH.key)} · ${esc(BOOTH.slug)}</div>
        <p class="subtitle">Press START to call the next player. Nothing is fetched until you ask.</p></div>
      <div class="panel"><div class="panel-head"><h3>◆ NEXT PLAYER ◆</h3><span class="queue-meta" id="queue-count">${boothPending?boothPending+' WAITING':''}</span></div>
        <div class="queue-flash" id="queue-flash">${esc(queueFlash)}</div>
        <div class="queue-empty" id="booth-message">${boothReady()?'READY · '+esc(BOOTH.key):'NO BOOTH KEY · LOCAL PLAY ONLY'}</div>
        <button class="btn primary" data-action="booth-start" ${boothReady()?'':'disabled'}>START · CALL NEXT PLAYER</button>
        <button class="btn" data-action="leaderboard">HIGH SCORE BOARD</button>
        <button class="btn" data-action="play">LOCAL PLAY · NO QUEUE</button>
        <button class="btn" data-action="how">HOW TO PLAY</button>
        <button class="btn" data-action="settings">MACHINE SETTINGS</button>
        <div style="margin-top:14px;color:var(--muted);font-size:17px">BEST · LIGHTS <strong style="color:var(--green)">${bestOf('sequence')}</strong> · CARDS <strong style="color:var(--green)">${bestOf('cards')}</strong> · RUNNER <strong style="color:var(--green)">${bestOf('runner')}</strong></div>
      </div></section>`);
  }
  async function callNextPlayer(){
    if(!boothReady()){queueFlash='NO BOOTH KEY CONFIGURED';home();return}
    const start=app.querySelector('[data-action="booth-start"]');
    const message=document.getElementById('booth-message');
    if(start){start.disabled=true;start.textContent='CHECKING QUEUE...'}
    if(message)message.textContent='ASKING THE BOOTH...';
    try{
      const res=await fetch(BOOTH.api,{headers:{'x-booth-key':BOOTH.key},cache:'no-store'});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||data.ok===false)throw new Error(boothError(data,res.status));
      boothHead=data.item||null;
      boothPending=boothHead?Math.max(1,Number(data.pending)||0):0;
      queueFlash='';
      if(!boothHead){queueFlash='THE LINE IS EMPTY. NOBODY TO CALL.';boothPending=0;home();return}
      confirmPlayer();
    }catch(err){
      queueFlash='COULD NOT READ THE QUEUE · '+(err instanceof Error?err.message:String(err)).toUpperCase();
      home();
    }
  }
  function confirmPlayer(){
    screen='confirm';
    const name=boothHead?boothHead.name||'CARNIVAL GUEST':'CARNIVAL GUEST';
    const ticket=boothHead?boothHead.ticket_key||'':'';
    const behind=Math.max(0,boothPending-1);
    shell(`<div style="text-align:center"><h2>CALL THE NEXT PLAYER</h2><p class="subtitle">Confirm this is the person standing at the booth.</p>
      <div class="panel" style="max-width:680px;margin:0 auto;text-align:left">
        <div class="queue-row head" style="margin-bottom:14px"><span class="q-pos">1</span><span class="q-name" style="font-size:28px">${esc(name)}<small style="font-size:19px">TICKET ${esc(ticket)}</small></span><span class="q-badge">UP NOW</span></div>
        <div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><label>WAITING BEHIND</label><strong>${behind}</strong></div><div class="stat"><label>BOOTH</label><strong>${esc(BOOTH.key)}</strong></div></div>
        <button class="btn primary" data-action="booth-confirm">CONFIRM · START GAME</button>
        <button class="btn danger" data-action="booth-cancel">CANCEL · REMOVE PLAYER FROM QUEUE</button>
      </div></div>`);
  }
  function confirmStartPlayer(){
    if(!boothHead){queueFlash='NOBODY IS WAITING IN LINE';home();return}
    activePlayer={ticket_key:boothHead.ticket_key,name:boothHead.name||'CARNIVAL GUEST'};
    playerName=String(activePlayer.name).slice(0,16);
    try{localStorage.setItem('hauntotron_name',playerName)}catch(e){}
    queueFlash='';
    chooseMode();
  }
  async function cancelHeadPlayer(){
    if(!boothHead){home();return}
    const player=boothHead;
    boothHead=null;boothPending=0;
    try{
      await boothPost({ticket_key:player.ticket_key,cancel:true});
      queueFlash=`REMOVED ${String(player.name||player.ticket_key).toUpperCase()} FROM THE QUEUE`;
    }catch(err){
      queueFlash='COULD NOT REMOVE · '+(err instanceof Error?err.message:String(err)).toUpperCase();
    }
    home();
  }
  async function boothPost(body){
    if(!boothReady())throw new Error('booth is not configured');
    const res=await fetch(BOOTH.api,{method:'POST',headers:{'x-booth-key':BOOTH.key,'content-type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.ok===false)throw new Error(boothError(data,res.status));
    return data;
  }
  function chooseMode(){
    screen='mode';
    const playing=activePlayer
      ?`<p>NOW PLAYING <strong style="color:var(--green)">${esc(playerName)}</strong> <span style="color:var(--muted)">· TICKET ${esc(activePlayer.ticket_key)}</span></p>`
      :`<p>Playing as <strong style="color:var(--green)">${esc(playerName)}</strong> &nbsp;<button class="btn small secondary" style="min-width:0;padding:2px 10px;margin:0" data-action="play">CHANGE NAME</button></p>`;
    shell(`<h2>CHOOSE YOUR ATTRACTION</h2>${playing}
      <div class="mode-grid">
        <button class="mode ${gameType==='sequence'?'selected':''}" data-game="sequence"><span>💡</span><strong>SEQUENCE LIGHTS</strong><span>Repeat the pattern</span></button>
        <button class="mode ${gameType==='cards'?'selected':''}" data-game="cards"><span>🃏</span><strong>CARD MATCH</strong><span>Find every pair</span></button>
        <button class="mode ${gameType==='runner'?'selected':''}" data-game="runner"><span>👻</span><strong>GHOST RUNNER</strong><span>Jump and dodge</span></button>
      </div><div class="panel" style="margin-top:20px"><p id="mode-desc">${modeDescription()}</p><button class="btn primary" data-action="begin">START SELECTED GAME</button><button class="btn secondary" data-action="${activePlayer?'booth-home':'home'}">${activePlayer?'BACK TO QUEUE':'BACK TO LOBBY'}</button></div>`);
  }
  function modeDescription(){
    const m=modes[mode];
    if(gameType==='cards')return `${m.label}: 10 pairs to find, but only 24 moves. Earn 30 points per match plus a bonus for every move you have left.`;
    if(gameType==='runner')return `${m.label}: jump gravestones and duck under bats. The world keeps getting faster. The longer you survive, the higher your score.`;
    return `${m.label}: ${m.count} glowing pads, ${m.rounds} possible rounds. Earn ${m.points} base points per round. The pattern grows and speeds up every round, and you only get 3 replays.`;
  }
  function nameScreen(){
    screen='name';
    shell(`<h2>WHO'S PLAYING?</h2><p>Enter your name before you step onto the midway. Your scores will be saved on the leaderboard under this name.</p>
      <div class="panel"><form id="name-form" class="formrow"><input id="player-name" maxlength="16" value="${esc(playerName)}" placeholder="YOUR NAME" autocomplete="nickname" required><button class="btn small primary" type="submit">CONTINUE</button></form></div>
      <button class="btn secondary" data-action="home">BACK TO LOBBY</button>`);
    const input=document.getElementById('player-name');if(input){input.focus();input.select();}
  }
  function beginGame(){
    if(!playerName.trim()){nameScreen();return}
    loadBest();
    score=0;round=1;sequence=[];inputIndex=0;accepting=false;busy=false;
    if(gameType==='cards'){beginCards();return}
    if(gameType==='runner'){beginRunner();return}
    replaysLeft=3;screen='game';sequence.push(randomPad(),randomPad());renderGame('WATCH CLOSELY...');setTimeout(playSequence,550);
  }
  function beginCards(){
    screen='cards';cardMoves=0;flippedCards=[];matchedCards=[];
    const pairCount=10;cardLimit=pairCount*2+4;
    const faces=['🎃','👻','🦇','🕷️','💀','🧙','🕸️','🧛','🪦','🌙'];
    cardDeck=faces.slice(0,pairCount).flatMap((face,i)=>[{id:i*2,face},{id:i*2+1,face}]).sort(()=>Math.random()-.5);
    renderCards('FLIP TWO CARDS TO FIND A PAIR');
  }
  function renderCards(message){
    screen='cards';

      ctx.fillStyle='#7bff9a';for(let i=0;i<22;i++){let x=(i*47-(g.frames*g.speed*.25)%760+760)%760;ctx.fillRect(x,20+(i*31)%95,2,2)}
      ctx.fillStyle='#283c31';ctx.fillRect(0,210,760,40);ctx.strokeStyle='#7bff9a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,210);ctx.lineTo(760,210);ctx.stroke();
      ctx.fillStyle='#18231d';for(let i=0;i<8;i++){let x=(i*115-(g.frames*g.speed*.45)%920+920)%920;ctx.fillRect(x,177,35,33);ctx.beginPath();ctx.arc(x+17.5,177,17.5,Math.PI,0);ctx.fill();}
      for(const o of g.obstacles){if(o.type==='grave'){ctx.fillStyle='#9ba49b';ctx.fillRect(o.x+5,o.y+9,18,21);ctx.fillRect(o.x,o.y+15,28,6);ctx.fillStyle='#ff762b';ctx.fillRect(o.x+12,o.y+15,3,10)}else{ctx.fillStyle='#c46cff';ctx.font='28px serif';ctx.fillText('🦇',o.x-3,o.y+24)}}
      ctx.fillStyle='#e5d9b5';ctx.fillRect(px+5,py+4,23,21);ctx.fillRect(px,py+11,33,13);ctx.fillRect(px+2,py+23,7,8);ctx.fillRect(px+13,py+23,7,8);ctx.fillRect(px+24,py+23,7,8);ctx.fillStyle='#090d0c';ctx.fillRect(px+10,py+10,4,6);ctx.fillRect(px+21,py+10,4,6);

      case 'settings':settings();break;
      case 'again':beginGame();break;
      case 'quit':if(confirm(activePlayer?'Leave this run? The player stays in the queue, and no score will be posted.':'Leave this run? Your current score will not be saved.')){activePlayer=null;home()}break;
      case 'replay':if(!busy&&screen==='game'&&replaysLeft>0){replaysLeft--;accepting=false;busy=true;renderGame('WATCH CLOSELY...');playSequence();}break;
      case 'sound':soundOn=!soundOn;settings();break;
      case 'clear-scores':if(confirm('Clear all leaderboard entries stored in this browser?')){localStorage.removeItem(STORE_KEY);leaderboard(lbGame)}break;
    }
  });
  app.addEventListener('pointerdown',e=>{
    const b=e.target.closest('[data-run]');
    if(b){e.preventDefault();if(b.dataset.run==='jump')runnerJump();else if(runnerState&&screen==='runner')runnerState.duck=true;return}
    if(e.target.id==='runner-canvas'){e.preventDefault();runnerJump();}
  });
  const stopDuck=()=>{if(runnerState)runnerState.duck=false};
  document.addEventListener('pointerup',stopDuck);document.addEventListener('pointercancel',stopDuck);
  app.addEventListener('submit',e=>{
    if(e.target.id!=='name-form')return;
    e.preventDefault();
    const input=document.getElementById('player-name');
    const v=(input?.value||'').trim();
    if(!v){if(input){input.value='';input.focus();}return}
    playerName=v.slice(0,16);
    try{localStorage.setItem('hauntotron_name',playerName)}catch(err){}
    clickSound();chooseMode();
  });
  document.addEventListener('keydown',e=>{
    if(screen!=='game'||!accepting||busy)return;
    const key=Number(e.key);
    if(key>=1&&key<=modes[mode].count)handlePad(key-1);
  });
  home();
})();
</script>
</body>
</html>
